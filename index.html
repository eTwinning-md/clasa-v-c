<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clasa noastră · a V-a C</title><style>:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#203044;background:#f6f8fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1050px;margin:auto;padding:20px}header{background:#fff;border-bottom:1px solid #e4eaf0}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{font-weight:800;font-size:23px;color:#244c78}.sub{color:#687a90;font-size:13px}nav{display:flex;gap:7px;overflow:auto;padding:17px 0 0}button{font:inherit;cursor:pointer;border:0}nav button,.daybtn{padding:10px 15px;border-radius:12px;background:#eff3f8;color:#35475d;white-space:nowrap}nav button.active,.daybtn.active{background:#285b89;color:#fff}main{padding-top:28px}h1{font-size:clamp(25px,4vw,35px);margin:0 0 8px}h2{font-size:20px;margin:0 0 17px}.muted{color:#687a90}.grid{display:grid;grid-template-columns:1.35fr 1fr;gap:18px}.card{background:#fff;border:1px solid #e5ebf2;border-radius:18px;padding:22px;box-shadow:0 5px 18px #213c5710;margin-bottom:18px}.clockbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;background:linear-gradient(110deg,#eaf2fb,#eff8f3);border:1px solid #dbe8f2;border-radius:17px;padding:16px 20px;margin:16px 0 20px}.clockdate{font-size:16px;font-weight:650;color:#344d66}.clocktime{font-size:clamp(27px,5vw,39px);font-weight:800;letter-spacing:1px;color:#285b89;font-variant-numeric:tabular-nums}.pill{display:inline-block;padding:6px 11px;border-radius:20px;background:#eaf5ef;color:#236a4d;font-size:13px;font-weight:700}.lesson{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid #edf0f4}.lesson:last-child{border:0}.num{display:grid;place-items:center;width:38px;height:38px;flex-shrink:0;border-radius:12px;background:#edf3fa;color:#285b89;font-weight:800}.lesson.current{background:#eff8f3;margin:0 -10px;padding:13px 10px;border-radius:12px}.time{margin-left:auto;color:#64768c;font-size:13px;white-space:nowrap}.days{display:flex;gap:8px;overflow:auto;margin:17px 0}.teachergrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.teacher{padding:16px;border:1px solid #e6ecf2;border-radius:13px;background:#fbfcfe}.teacher strong{display:block;margin-bottom:6px}.teacher small{color:#687a90;line-height:1.6}.bells{width:100%;border-collapse:collapse}.bells th,.bells td{text-align:left;padding:11px;border-bottom:1px solid #edf0f4}.bells th{color:#687a90;font-size:13px}.note{background:#f0f5fa;padding:13px;border-radius:12px;color:#52677d;font-size:14px}.calendar-controls{display:flex;justify-content:space-between;align-items:center;margin:20px 0}.calendar-controls button{padding:10px 16px;background:#edf3fa;color:#285b89;border-radius:12px}.month-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.calday{min-height:58px;text-align:center;padding:9px 2px;border:1px solid #e7ecf2;border-radius:10px;font-weight:650}.calday.empty{border:0}.calday.weekend{background:#f1f4f8;color:#8593a3}.calday.vacation{background:#def3e7;color:#246849;border-color:#9ed7b8}.calday.today{outline:2px solid #285b89}.weekday{text-align:center;color:#63758b;font-size:12px;font-weight:700;padding:9px 0}.calday small{display:block;font-size:9px;margin-top:4px}.vaclist{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.vacitem{padding:16px;background:#f4f8fc;border-radius:13px}.vacitem strong{display:block;margin-bottom:5px}.vacitem span{color:#5d7188;font-size:13px}@media(max-width:550px){.calday{min-height:49px;font-size:13px}.month-grid{gap:3px}.vaclist{grid-template-columns:1fr}}footer{padding:25px 0;color:#77879b;text-align:center;font-size:13px}@media(max-width:700px){.grid,.teachergrid{grid-template-columns:1fr}.wrap{padding:14px}.card{padding:16px}.time{font-size:12px}.brand{font-size:21px}}</style></head><body><header><div class="wrap"><div class="top"><div><div class="brand">✦ Clasa noastră · a V-a C</div><div class="sub">Anul școlar 2026–2027</div></div><span class="pill">Informații pentru elevi, părinți și profesori</span></div><nav id="nav"></nav></div></header><main class="wrap" id="app"></main><footer>Clasa a V-a C · Informații școlare</footer><script>
const days=['Luni','Marți','Miercuri','Joi','Vineri'];const hours=[['08:15','09:00'],['09:10','09:55'],['10:10','10:55'],['11:10','11:55'],['12:10','12:55'],['13:05','13:50'],['13:55','14:40']];const schedule=[['Matematică','Educația pentru societate','Limba și literatura română','Educația fizică','Limba rusă','Limba engleză'],['Educația plastică','Limba și literatura română','Educația muzicală','Educația tehnologică','Matematică'],['Matematică','Limba și literatura română','Limba și literatura română','Dezvoltarea personală'],['Istoria românilor și universală','Matematică','Limba rusă','Limba și literatura română','Limba engleză'],['Istoria românilor și universală','Geografie','Educația fizică','Limba și literatura română','Citind învăț să fiu','Științe']];const teachers=[['Condrea Zinaida','Dirigintă · Limba și literatura română · Limba rusă · Citind învăț să fiu · Dezvoltarea personală'],['Serediuc Nina','Matematică'],['Mucea Irina','Limba engleză'],['Gîndea Cristina','Limba engleză'],['Stratciuc Ludmila','Geografie · Științe · Educația tehnologică (fete)'],['Popov Polina','Educația plastică'],['Ciobanu Viorica','Istoria românilor și universală · Educația tehnologică (băieți)'],['Tupicico Gabriel','Educația fizică'],['Damaschin Oxana','Educația pentru societate'],['Bâtă Stelian','Educația muzicală']];let calendarMonth=1;const monthNames=['Ianuarie','Februarie','Martie','Aprilie','Mai','Iunie','Iulie','August','Septembrie','Octombrie','Noiembrie','Decembrie'];const holidays=[{name:'Vacanța de toamnă',start:'2026-10-24',end:'2026-11-01'},{name:'Vacanța de iarnă',start:'2026-12-25',end:'2027-01-10'},{name:'Vacanța de primăvară',start:'2027-03-08',end:'2027-03-15'},{name:'Vacanța de Paști',start:'2027-05-01',end:'2027-05-10'}];function monthHTML(){const year=calendarMonth<4?2026:2027,m=(calendarMonth+8)%12,first=new Date(year,m,1),offset=(first.getDay()+6)%7,count=new Date(year,m+1,0).getDate();let cells=Array.from({length:offset},()=>'<div class="calday empty"></div>');for(let day=1;day<=count;day++){const date=year+'-'+String(m+1).padStart(2,'0')+'-'+String(day).padStart(2,'0'),wd=new Date(year,m,day).getDay(),holiday=holidays.find(h=>date>=h.start&&date<=h.end),today=new Date().getFullYear()===year&&new Date().getMonth()===m&&new Date().getDate()===day;cells.push(`<div class="calday ${wd===0||wd===6?'weekend':''} ${holiday?'vacation':''} ${today?'today':''}" data-date="${date}" title="${holiday?holiday.name:date}">${day}${holiday?'<small>Vacanță</small>':''}</div>`)}return `<div class="calendar-controls"><button data-prev="1" aria-label="Luna precedentă">←</button><strong>${monthNames[m]} ${year}</strong><button data-next="1" aria-label="Luna următoare">→</button></div><div class="month-grid">${['Lu','Ma','Mi','Jo','Vi','Sâ','Du'].map(x=>`<div class="weekday">${x}</div>`).join('')}${cells.join('')}</div>`}let eventsCache=[];let page='Acasă',selected=Math.min(new Date().getDay()-1,4);if(selected<0)selected=0;const pages=['Acasă','Orarul lecțiilor','Orarul sunetelor','Profesorii','Calendarul școlar','Temele pentru acasă','Evenimentele clasei'];const mins=t=>{let [h,m]=t.split(':').map(Number);return h*60+m};function state(){const d=new Date(),now=d.getHours()*60+d.getMinutes(),wd=d.getDay()-1;if(wd<0||wd>4)return {label:'Weekend · fără lecții',idx:-1};for(let i=0;i<hours.length;i++){let [a,b]=hours[i].map(mins);if(now>=a&&now<b)return {label:`Lecția ${i+1} · ${b-now} min până la pauză`,idx:i};if(now<a)return {label:`Următoarea lecție începe în ${a-now} min`,idx:-1};}return {label:'Lecțiile s-au încheiat',idx:-1}}function lessonList(day,highlight=false){let st=state();return schedule[day].map((s,i)=>`<div class="lesson ${highlight&&day===new Date().getDay()-1&&i===st.idx?'current':''}"><span class="num">${i+1}</span><div><strong>${s}</strong><div class="muted" style="font-size:12px">Lecția ${i+1}</div></div><span class="time">${hours[i][0]}–${hours[i][1]}</span></div>`).join('')};function updateClock(){const e=document.getElementById('live-clock'),f=document.getElementById('live-date');if(!e||!f)return;const now=new Date();e.textContent=now.toLocaleTimeString('ro-RO',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});f.textContent=now.toLocaleDateString('ro-RO',{weekday:'long',day:'numeric',month:'long',year:'numeric'});}function draw(){document.getElementById('nav').innerHTML=pages.map(p=>`<button class="${page===p?'active':''}" data-page="${p}">${p}</button>`).join('');let d=new Date(),wd=d.getDay()-1,st=state(),date=d.toLocaleDateString('ro-RO',{weekday:'long',day:'numeric',month:'long',year:'numeric'});let html='';if(page==='Acasă'){html=`<h1>Bun venit în clasa noastră!</h1><div class="clockbar"><div><div class="muted" style="font-size:12px;margin-bottom:4px">Astăzi</div><div class="clockdate" id="live-date">${date}</div></div><div><div class="muted" style="font-size:12px;margin-bottom:4px">Ora actuală</div><div class="clocktime" id="live-clock" role="timer" aria-label="Ora actuală">--:--:--</div></div></div><div id="next-event"></div><div class="grid"><section class="card"><h2>${wd>=0&&wd<5?'Lecțiile de astăzi':'Următoarea zi de școală'}</h2><span class="pill">${st.label}</span>${lessonList(wd>=0&&wd<5?wd:0,true)}</section><section><div class="card"><h2>Orarul sunetelor</h2>${hours.map((h,i)=>`<div class="lesson"><span class="num">${i+1}</span><strong>${h[0]} – ${h[1]}</strong></div>`).join('')}</div><div class="card"><h2>Diriginta clasei</h2><strong>Condrea Zinaida</strong><p class="muted">Clasa a V-a C · 2026–2027</p></div></section></div>`}if(page==='Orarul lecțiilor'){html=`<h1>Orarul lecțiilor</h1><p class="muted">Selectează o zi pentru a vedea lecțiile și intervalele orare.</p><div class="days">${days.map((x,i)=>`<button class="daybtn ${selected===i?'active':''}" data-day="${i}">${x}</button>`).join('')}</div><div class="card"><h2>${days[selected]}</h2>${lessonList(selected)}</div>`}if(page==='Orarul sunetelor'){html=`<h1>Orarul sunetelor</h1><p class="muted">Fiecare lecție durează 45 de minute.</p><div class="card"><table class="bells"><thead><tr><th>Lecția</th><th>Interval</th><th>Pauza următoare</th></tr></thead><tbody>${hours.map((h,i)=>`<tr><td>${i+1}</td><td>${h[0]}–${h[1]}</td><td>${i<6?mins(hours[i+1][0])-mins(h[1])+' min':'—'}</td></tr>`).join('')}</tbody></table></div>`}if(page==='Profesorii'){html=`<h1>Profesorii clasei</h1><p class="muted">Cadrele didactice și disciplinele predate în clasa a V-a C.</p><div class="card"><div class="teachergrid">${teachers.map(t=>`<div class="teacher"><strong>${t[0]}</strong><small>${t[1]}</small></div>`).join('')}</div></div>`}if(page==='Calendarul școlar'){html=`<h1>Calendarul școlar 2026–2027</h1><p class="muted">Selectează luna. Vacanțele sunt evidențiate cu verde, iar weekendurile cu gri.</p><div class="card"><div class="teachergrid"><div class="teacher"><strong>Semestrul I</strong><small>1 septembrie – 24 decembrie 2026</small></div><div class="teacher"><strong>Semestrul II</strong><small>11 ianuarie – 31 mai 2027</small></div></div>${monthHTML()}<div id="calendar-events" class="note" style="margin-top:14px">Evenimentele publicate vor fi marcate în calendar.</div></div><div class="card"><h2>Vacanțele școlare</h2><div class="vaclist">${holidays.map(h=>`<div class="vacitem"><strong>${h.name}</strong><span>${new Date(h.start+'T12:00:00').toLocaleDateString('ro-RO',{day:'numeric',month:'long',year:'numeric'})} – ${new Date(h.end+'T12:00:00').toLocaleDateString('ro-RO',{day:'numeric',month:'long',year:'numeric'})}</span></div>`).join('')}</div></div>`}if(page==='Temele pentru acasă'){html=`<h1>Temele pentru acasă</h1><p class="muted">Selectează data pentru care trebuie prezentate temele. Informațiile sunt completate de profesori.</p><div class="card"><label for="homework-date"><strong>Data predării</strong></label><p><input id="homework-date" type="date" style="padding:11px;border:1px solid #d9e3ee;border-radius:10px;font:inherit;max-width:100%"></p><div id="homework-list" aria-live="polite">Se verifică temele publicate…</div><p class="muted" style="font-size:12px">Lipsa unei înregistrări nu înseamnă că nu există temă. Verificați și indicațiile profesorului.</p></div>`} if(page==='Evenimentele clasei'){html=`<h1>Evenimentele clasei</h1><p class="muted">Activități și evenimente comunicate de dirigintă.</p><div class="card"><h2>Calendarul evenimentelor</h2><div id="events-list">Se verifică evenimentele…</div></div>`} document.getElementById('app').innerHTML=html;updateClock();if(page==='Temele pentru acasă')initHomework();if(['Evenimentele clasei','Calendarul școlar','Acasă'].includes(page))loadEvents();document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;draw();window.scrollTo(0,0)});document.querySelectorAll('[data-prev]').forEach(b=>b.onclick=()=>{calendarMonth=Math.max(0,calendarMonth-1);draw()});document.querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>{calendarMonth=Math.min(8,calendarMonth+1);draw()});document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{selected=+b.dataset.day;draw()})}draw();setInterval(()=>{updateClock();if(page==='Acasă'&&new Date().getSeconds()===0)draw()},1000);

const HOMEWORK_API_URL='const HOMEWORK_API_URL='https://script.google.com/macros/s/AKfycbx6AVQe8I5x0aJd2l-NS-ev0nxUkSenfgm72XhquOaJPthVullTozGDsbEXue3uIhsg/exec';'; // Introdu aici adresa aplicației web Apps Script (terminată în /exec).
const escHomework=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let homeworkCache=null;
async function initHomework(){const field=document.getElementById('homework-date');if(!field)return;const now=new Date();field.value=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;field.onchange=renderHomework;await loadHomework();}
async function loadHomework(){const target=document.getElementById('homework-list');if(!target)return;if(!HOMEWORK_API_URL){target.innerHTML='<p class="muted">Registrul nu este conectat încă. După publicarea aplicației Google Apps Script, adaugă adresa acesteia în configurația site-ului.</p>';return;}try{const res=await fetch(HOMEWORK_API_URL+(HOMEWORK_API_URL.includes("?")?"&":"?")+"view=data",{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);const data=await res.json();homeworkCache=Array.isArray(data)?data:data.teme;if(!Array.isArray(homeworkCache))throw Error('Format de date invalid');renderHomework()}catch(e){target.innerHTML='<p class="muted">Temele nu pot fi încărcate momentan. Reîncearcă mai târziu.</p>';}}
function renderHomework(){const target=document.getElementById('homework-list'),date=document.getElementById('homework-date')?.value;if(!target||!homeworkCache)return;const rows=homeworkCache.filter(x=>x.data===date);target.innerHTML=rows.length?rows.map(x=>`<div class="lesson" style="display:block;margin-bottom:10px"><strong>${escHomework(x.disciplina)}</strong><p style="margin:6px 0">${x.status==='Nu este temă'?'Nu este temă.':escHomework(x.tema)}</p>${x.profesor?`<small class="muted">${escHomework(x.profesor)}</small>`:''}${/^https:\/\//.test(x.link||'')?`<p><a href="${escHomework(x.link)}" target="_blank" rel="noopener noreferrer">Material suplimentar ↗</a></p>`:''}</div>`).join(''):'<p class="muted">Nu sunt teme publicate pentru această dată.</p>';}

async function loadEvents(){
 const el=document.getElementById('events-list'),next=document.getElementById('next-event'),cal=document.getElementById('calendar-events');
 if(!HOMEWORK_API_URL){if(el)el.textContent='Evenimentele vor apărea după conectarea registrului Google Sheets.';if(cal)cal.textContent='Evenimentele vor fi marcate după conectarea registrului.';return;}
 try{const response=await fetch(HOMEWORK_API_URL+(HOMEWORK_API_URL.includes("?")?"&":"?")+"view=data",{cache:'no-store'});if(!response.ok)throw Error('HTTP');const payload=await response.json();eventsCache=Array.isArray(payload.evenimente)?payload.evenimente:[];renderEvents();}
 catch(e){if(el)el.textContent='Evenimentele nu pot fi încărcate momentan.';}
}
function renderEvents(){
 const today=new Date();const iso=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
 const rows=eventsCache.filter(x=>x.data && x.data>=iso).sort((a,b)=>(a.data+(a.ora||'')).localeCompare(b.data+(b.ora||'')));
 const fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('ro-RO',{day:'numeric',month:'long',year:'numeric'});
 const eventHtml=e=>`<div class="lesson" style="display:block"><strong>${escHomework(e.titlu)}</strong> ${e.status==='Anulat'?'<span class="pill">Anulat</span>':''}<p style="margin:6px 0">📅 ${fmt(e.data)}${e.ora?' · '+escHomework(e.ora):''}${e.loc?' · '+escHomework(e.loc):''}</p>${e.descriere?`<p class="muted">${escHomework(e.descriere)}</p>`:''}${/^https:\/\//.test(e.link||'')?`<a href="${escHomework(e.link)}" rel="noopener noreferrer" target="_blank">Mai multe informații ↗</a>`:''}</div>`;
 const el=document.getElementById('events-list');if(el)el.innerHTML=rows.length?rows.map(eventHtml).join(''):'<p class="muted">Nu sunt evenimente viitoare publicate.</p>';
 const next=document.getElementById('next-event');if(next){const e=rows.find(x=>x.status!=='Anulat');next.innerHTML=e?`<div class="card"><h2>Următorul eveniment</h2>${eventHtml(e)}</div>`:'';}
 const cal=document.getElementById('calendar-events');if(cal){const marked=eventsCache.filter(e=>e.data&&e.status!=='Anulat');document.querySelectorAll('.calday[data-date]').forEach(cell=>{const found=marked.filter(e=>e.data===cell.dataset.date);if(found.length){cell.style.borderColor='#377ab0';cell.style.background='#e6f1ff';cell.title=found.map(e=>e.titlu).join(' • ');cell.insertAdjacentHTML('beforeend','<small>● Eveniment</small>');}});cal.textContent='● Albastru: zi cu eveniment · Verde: vacanță';}
}
</script></body></html>
